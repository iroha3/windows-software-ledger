<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开发环境复现 · 软件备份台账</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%232c6e64%22 stroke-width=%222%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22><path d=%22M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z%22/><polyline points=%223.27 6.96 12 12.01 20.73 6.96%22/><line x1=%2212%22 y1=%2222.08%22 x2=%2212%22 y2=%2212%22/></svg>">
  <style>
    svg { fill: none; }
    svg.i { width: 15px; height: 15px; stroke: currentColor; fill: none; vertical-align: middle; }
    svg.i.lg { width: 22px; height: 22px; }
    svg.i.sm { width: 13px; height: 13px; }
    body { background-color: #fcfbf9; }
  </style>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Toast 提示容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- 顶部导航栏 (与主页/卡片速审严格同高同宽) -->
  <header>
    <div class="logo-section">
      <a href="/" class="btn btn-secondary" title="返回主表格视图">
        <svg class="i sm" viewBox="0 0 24 24"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>返回表格</span>
      </a>
      <div class="logo-title" style="margin-left: 6px; display: inline-flex; align-items: center; gap: 6px;">
        <svg class="i sm" viewBox="0 0 24 24"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
        开发环境复现
      </div>
      <div class="logo-actions">
        <button id="btnThemeToggle" class="icon-btn" title="切换日间/夜间模式"><span id="themeIcon"></span><span id="themeText" style="display:none"></span></button>
      </div>
    </div>

    <div class="header-actions">
      <button id="btnDevRefresh" class="btn btn-secondary" title="重新读取本机采集到的开发环境清单">
        <svg class="i sm" viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
        <span>刷新</span>
      </button>
    </div>
  </header>

  <main class="dev-env-main">
    <div class="dev-env-hero">
      <h2>开发环境清单</h2>
      <p>
        扫描本机时一并采集的声明式清单：包管理器全局包、编辑器扩展、工具链与全局配置。
        <strong>只跑只读命令白名单——不读取环境变量块、SSH key、git 凭据或任何敏感文件。</strong>
        按设备分组，展开即可复制恢复命令；命令中的路径相对于应用根目录，清单原文在
        <code>data/evidence/&lt;设备&gt;/dev-env/</code> 下。本页只是证据，不会改动软件清单。
      </p>
    </div>

    <div class="dev-env-toolbar">
      <label for="devMachineFilter">设备</label>
      <select id="devMachineFilter" class="select-filter" style="min-width: 180px;">
        <option value="all">全部设备</option>
      </select>
      <span class="dev-env-count" id="devProviderCount"></span>
    </div>

    <div id="devEnvContent"></div>
  </main>

  <script src="/tauri-shim.js"></script>
  <script src="/dev_env.js"></script>
</body>
</html>
