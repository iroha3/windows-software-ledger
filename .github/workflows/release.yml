name: release

# 推送到 master 时触发；若 src-tauri/Cargo.toml 的版本号对应
# 的 tag 尚不存在，则构建 exe、打包 zip 并创建 Release。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      released: ${{ steps.resolve.outputs.released }}
    steps:
      - uses: actions/checkout@v4

      - id: resolve
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::could not read version from src-tauri/Cargo.toml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$version already released — skipping build."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "v$version is new — will build and release."
          fi

  build:
    name: Build & release
    needs: version
    if: needs.version.outputs.released == 'false'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build release binary
        run: cargo build --release --manifest-path src-tauri/Cargo.toml

      - name: Package zip
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          $zip = "windows-software-ledger-v$version-windows-x64.zip"
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item "src-tauri/target/release/windows-software-ledger.exe" package/
          Copy-Item "LICENSE" package/
          Compress-Archive -Path "package/*" -DestinationPath $zip
          Write-Host "packaged $zip"

      - name: Create tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release create "v$version" \
            "windows-software-ledger-v$version-windows-x64.zip" \
            --target "$GITHUB_SHA" \
            --title "v$version" \
            --generate-notes
